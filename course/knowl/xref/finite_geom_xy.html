\begin{align}
\sum_{k=0}^{N}\left(x^{N-k}y^{k}\right)&amp;=
\left(x^{N}+x^{N-1}y+x^{N-2}y^{2}+\cdots+x^{2}y^{N-2}+xy^{N-1}+y^{N}\right)\notag\\
&amp;=\frac{\left(x^{N+1}-y^{N+1}\right)}{x-y}\tag{5}
\end{align}
